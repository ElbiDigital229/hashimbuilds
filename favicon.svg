<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- hashimbuilds compass mark — dial + bold gradient diamond needle -->
  <defs>
    <linearGradient id="ng" x1="16" y1="4" x2="16" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#14F590"/>
      <stop offset="0.40" stop-color="#14F590" stop-opacity="0.9"/>
      <stop offset="0.58" stop-color="#0FCCD8" stop-opacity="0.25"/>
      <stop offset="0.74" stop-color="#1DCAD5" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="bg" cx="50%" cy="42%" r="65%">
      <stop offset="0" stop-color="#23262a"/>
      <stop offset="1" stop-color="#0c0d0f"/>
    </radialGradient>
  </defs>

  <!-- dark dial -->
  <circle cx="16" cy="16" r="16" fill="url(#bg)"/>
  <!-- fine tick ring -->
  <circle cx="16" cy="16" r="13.2" fill="none" stroke="rgba(255,255,255,0.45)"
          stroke-width="1.6" stroke-dasharray="0.7 2.05"/>

  <!-- diamond needle: white base + green gradient falling down its length -->
  <path d="M16 3.4 C16.1 3.2 16.35 3.2 16.45 3.4 L21.4 15.4 a1.3 1.3 0 0 1 0 1.2 L16.45 28.6 C16.35 28.8 16.1 28.8 16 28.6 L11.05 16.6 a1.3 1.3 0 0 1 0 -1.2 Z"
        transform="translate(-0.22 0)" fill="#fff"/>
  <path d="M16 3.4 C16.1 3.2 16.35 3.2 16.45 3.4 L21.4 15.4 a1.3 1.3 0 0 1 0 1.2 L16.45 28.6 C16.35 28.8 16.1 28.8 16 28.6 L11.05 16.6 a1.3 1.3 0 0 1 0 -1.2 Z"
        transform="translate(-0.22 0)" fill="url(#ng)"/>
</svg>
